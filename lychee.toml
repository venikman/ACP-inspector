# Lychee link checker configuration (CI + local).
#
# Goal: keep CI stable by validating only repo-local links in Markdown.

scheme = ["file"]
offline = true
no_progress = true
# lychee >= 0.20 takes a mode here, not a bool; "anchor-only" matches the old
# `true` behavior (check `#section` anchors, not text fragments).
include_fragments = "anchor-only"

exclude_path = [
  '(^|/)node_modules/',
  '(^|/)coverage/',
  '(^|/)benchmarks/',
  '(^|/)tests/golden/',
  '(^|/)docs/_site/',
]
